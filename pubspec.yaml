name: vently_app
description: "Venttly — anonymous social platform for emotional expression and peer support"
publish_to: 'none'
version: 1.0.0+1

environment:
  # Raised from ^3.5.4 when the toolchain moved to Flutter 3.44 (Xcode 26 /
  # iOS 26 need it). The resolved dependency set already requires >=3.10.
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.7
  # 7.0.0 is the first release with UISceneDelegate support. Below it the
  # plugin rides the deprecated application lifecycle events, which warns on
  # every launch and stops working once Flutter drops the compatibility
  # shim — taking `venttly://group-invite/<token>` with it.
  app_links: ^7.2.1

  # Persistence
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Networking & backend
  supabase_flutter: ^2.6.0
  http: ^1.2.2

  # Crypto
  crypto: ^3.0.5
  cryptography: ^2.7.0
  uuid: ^4.5.1

  # UI utilities
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  image_picker: ^1.2.3
  shimmer: ^3.0.0
  intl: ^0.19.0
  collection: ^1.18.0

  # Share card export
  screenshot: ^3.0.0
  share_plus: ^10.0.2
  path_provider: ^2.1.4

  # Animations
  flutter_animate: ^4.5.0

  # Observability (Sprint 2)
  sentry_flutter: ^9.26.0
  # Used by Sentry to tag the release id with version+build number.
  # The pinned 8.3.0 lives in dependency_overrides below (Flutter 3.24
  # compatibility) — this declaration just makes it a direct dep so we
  # can import it without "unused override" warnings.
  package_info_plus: ^8.3.0

  # Audio playback for Whispers + voice-note bubbles
  just_audio: ^0.9.40
  audio_session: ^0.1.21
  # Local, pre-upload Whisper voice effects. Audio-only LGPL build.
  ffmpeg_kit_flutter_new_audio: 2.4.4

  # Foreground alerts plus opt-in OS-level push. Firebase auto-init is
  # disabled natively until the user enables alerts; device tokens are then
  # bound to the signed-in account through the `push_tokens` RPCs.
  flutter_local_notifications: ^17.2.3
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3

  # Audio capture for Whispers + chat voice-notes
  record: ^5.1.2
  permission_handler: ^11.3.1

  # QR code rendering for the My-QR sheet on the Friends screen
  qr_flutter: ^4.1.0
  connectivity_plus: ^6.1.0

  # Model names for the device list. Without it every row reads "Android
  # device", which tells nobody which session to end.
  device_info_plus: ^12.4.0
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# These pins were added for Flutter 3.24.5, which did not inject
# `flutter.compileSdkVersion` into plugin build.gradle files — anything
# published after 3.27 failed to configure. The toolchain has since moved to
# 3.44, so that constraint is gone and most of this block is probably
# removable.
#
# It is deliberately still here. Dropping a pin is only proven safe by
# exercising the feature on a real device, not by a build succeeding:
# record_* backs Whispers and chat voice notes, which a compiling APK says
# nothing about. Retire these one at a time, with hardware to test on.
dependency_overrides:
  # record_android 1.3.3 = "fix: Gradle compile SDK to 34"
  # 1.4.0+ switched to flutter.compileSdkVersion. Safe to revisit on 3.44,
  # but see the note above about verifying audio capture first.
  record_android: 1.3.3
  # record_linux 0.7.2 (auto-resolved by `record: ^5.1.2`) implements an
  # older RecordPlatformInterface than the 1.5.x interface the rest of the
  # tree uses, breaking Dart kernel compilation. 1.3.0 implements the
  # current interface (hasPermission `request` parameter + startStream).
  record_linux: 1.3.0
  # package_info_plus 9.x reads `flutter.compileSdkVersion` from its own
  # android/build.gradle, which only works on Flutter 3.27+ (where the
  # Flutter Gradle plugin propagates the `flutter` extension to all
  # subprojects). 8.3.0 is the last 8.x release and hardcodes compileSdk.
  # On 3.44 this pin is almost certainly obsolete — the package is used
  # only to tag the Sentry release, so it is the cheapest one to retire.
  package_info_plus: 8.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
