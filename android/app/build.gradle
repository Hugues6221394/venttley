plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseSigningKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
def missingReleaseSigningKeys = releaseSigningKeys.findAll {
    !keystoreProperties[it]?.toString()?.trim()
}
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}

if (releaseTaskRequested &&
        (!keystorePropertiesFile.exists() || !missingReleaseSigningKeys.isEmpty())) {
    throw new GradleException(
        "Release signing is not configured. Copy android/key.properties.example " +
        "to android/key.properties and provide the private production keystore values."
    )
}

android {
    namespace = "rw.vently.vently_app"
    // Follows the SDK Flutter blesses rather than a hard-coded level, so
    // AndroidX dependencies that demand a newer compileSdk don't fail the
    // build. Injected by the Flutter Gradle plugin (3.27+).
    compileSdk = flutter.compileSdkVersion
    // Pinned to the installed NDK. This dates from Flutter 3.24.5, whose
    // `flutter.ndkVersion` default (23.1.7779620) was neither installed here
    // nor new enough for the 26.1+ several plugins require. The toolchain is
    // now on 3.44 with a newer default, so this pin is worth re-checking —
    // it holds only because NDKs are backward-compatible and the installed
    // 29.x satisfies every plugin.
    ndkVersion = "29.0.14206865"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // flutter_local_notifications uses java.time APIs that need
        // core-library desugaring on minSdk < 26. The dependency below
        // ships the desugar JDK 11 jars Gradle expects.
        coreLibraryDesugaringEnabled = true
    }

    defaultConfig {
        applicationId = "rw.vently.vently_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // The maintained audio-only FFmpeg runtime used for local Whisper
        // voice effects requires Android 7.0+. Processing stays on-device.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists() && missingReleaseSigningKeys.isEmpty()) {
                storeFile = rootProject.file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

// Kotlin 2.x replacement for the `kotlinOptions` block that used to live in
// `android {}`; that DSL is gone in AGP 9.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
