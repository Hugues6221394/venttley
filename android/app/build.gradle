plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "rw.vently.vently_app"
    compileSdk = flutter.compileSdkVersion
    // Pinned to the installed NDK. Flutter 3.24.5 defaults `flutter.ndkVersion`
    // to 23.1.7779620, which is not installed and is older than the 26.1+ that
    // several plugins require. NDKs are backward-compatible, so the installed
    // 29.x satisfies every plugin.
    ndkVersion = "29.0.14206865"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "rw.vently.vently_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // Bumped from flutter.minSdkVersion (21) to 23 because record_android
        // and several other modern Flutter plugins require Android 6.0+.
        // API 23 still covers ~99% of active Android devices.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
