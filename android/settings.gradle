pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Kept in lockstep with what Flutter 3.44.9's own `flutter create` template
    // ships, so the combination is one Flutter actively tests: AGP 9.0.1 needs
    // Gradle 9.x, and Gradle 9.1.0 is the first release that runs on Java 25 —
    // which is what Android Studio now bundles. Below this, `assembleDebug`
    // fails outright on an incompatible-JVM error.
    id "com.android.application" version "9.0.1" apply false
    id "org.jetbrains.kotlin.android" version "2.3.20" apply false
    id "com.google.gms.google-services" version "4.5.0" apply false
}

include ":app"
